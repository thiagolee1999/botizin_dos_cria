name: iPhone pickup monitor

# Runs indefinitely by re-dispatching itself at the end of each run.
# Start it once with "Run workflow". To stop: cancel the running job
# (a cancelled run does not re-dispatch) or disable the workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write # needed to dispatch the next run

concurrency:
  group: iphone-pickup-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    steps:
      - uses: actions/checkout@v4

      - name: Check Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Missing Telegram secrets"
            exit 1
          fi

      - name: Monitor iPhone availability
        id: monitor
        timeout-minutes: 65 # fail this step (not the job) so the next run still gets dispatched
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 iphone_telegram_monitor_github.py \
            --interval 30 \
            --checks 120

      # Re-dispatch unless cancelled or setup failed (e.g. missing secrets),
      # so a broken config doesn't spin in a tight loop.
      - name: Dispatch next run
        if: ${{ !cancelled() && steps.monitor.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.monitor.outcome }}" = "failure" ]; then
            echo "Monitor failed; waiting 5 minutes before re-dispatching"
            sleep 300
          fi
          gh workflow run iphone-pickup.yml --ref "${{ github.ref_name }}"
