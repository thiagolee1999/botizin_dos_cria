name: iPhone pickup monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "13 * * * *"

permissions:
  contents: read

concurrency:
  group: iphone-pickup-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4

      - name: Restore previous inventory state
        uses: actions/cache/restore@v4
        with:
          path: .monitor/state.json
          key: iphone-pickup-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            iphone-pickup-state-

      - name: Check Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Missing Telegram secrets"
            exit 1
          fi

      - name: Monitor iPhone availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 iphone_telegram_monitor.py \
            --interval 60 \
            --checks 60 \
            --state-file .monitor/state.json

      - name: Save inventory state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor/state.json
          key: iphone-pickup-state-${{ github.run_id }}-${{ github.run_attempt }}
